name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- NEW STEP: Convert name to lowercase ---
      - name: Lowercase Repo Name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- UPDATED STEP: Use env.REPO_LC instead of github.repository ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Note the usage of env.REPO_LC below
          tags: ghcr.io/${{ env.REPO_LC }}/rag-backend:latest

      # --- UPDATED STEP: Use env.REPO_LC instead of github.repository ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # Note the usage of env.REPO_LC below
          tags: ghcr.io/${{ env.REPO_LC }}/rag-frontend:latest
